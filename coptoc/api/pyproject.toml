[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coptoc"
version = "0.3.0"
description = "Coptoc — Common Operating Picture API (S1/S3/S6; S2 via sigtoc)"
requires-python = ">=3.11"
dependencies = [
    "toc-shared",
    "sigtoc",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["coptoc"]
