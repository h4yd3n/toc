# XcodeGen project for the native iOS COP. Generate with `xcodegen generate` (see README).
name: TOC
options:
  bundleIdPrefix: com.h4yd3n
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  TOC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M69WQS6C98   # the author's team; the simulator build passes CODE_SIGNING_ALLOWED=NO on the command line
        # Where the wall's API is. The simulator uses the Mac's localhost; a real phone needs the Mac's LAN address:
        #   make ios-device TOC_API=http://<mac-lan-ip>:8000
        TOC_API: http://localhost:8000
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TOC
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        TOC_API: "$(TOC_API)"
        # Dev: the simulator talks to the FastAPI backend on the Mac over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
