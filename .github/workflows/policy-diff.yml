name: Policy-Diff Evaluation

on:
  pull_request:
    paths:
      - 'apps/coptoc/policies/**'

jobs:
  policy-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared -e modtoc
      - name: Run Policy Diff Harness
        run: |
          python apps/coptoc/evals/harness.py --policy apps/coptoc/policies/hate_speech.yaml --golden apps/coptoc/evals/golden_sets/hate_speech_golden.json --output-comment pr_comment.md
      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
