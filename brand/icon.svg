<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TOC app icon: the blue force dot inside the threat ring, on the wall's dark ground. -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#17202b"/><stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/><stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.12"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <!-- faint grid: the map -->
  <g stroke="#223041" stroke-width="2" opacity="0.55">
    <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
  </g>
  <!-- outer dashed ring: proximity, suggested -->
  <circle cx="512" cy="512" r="392" fill="none" stroke="#7b8aa0" stroke-width="6" stroke-dasharray="22 26" opacity="0.7"/>
  <!-- the threat ring: elevated posture, amber -->
  <circle cx="512" cy="512" r="300" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="30"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#f59e0b" stroke-width="30" opacity="0.5" filter="url(#soft)"/>
  <!-- compass ticks -->
  <g stroke="#dce4ee" stroke-width="16" stroke-linecap="round">
    <path d="M512 74V150M512 874V950M74 512H150M874 512H950"/>
  </g>
  <!-- blue force -->
  <circle cx="512" cy="512" r="230" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="118" fill="#3b82f6" stroke="#0b0f14" stroke-width="14"/>
  <circle cx="512" cy="512" r="150" fill="none" stroke="#60a5fa" stroke-width="10" opacity="0.9"/>
  <circle cx="512" cy="512" r="38" fill="#dce4ee"/>
</svg>
