[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toc-shared"
version = "0.1.0"
description = "Shared models and schemas for Coptoc & Sigtoc"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]
