[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigtoc"
version = "0.1.0"
description = "All-Source Threat Intelligence & Signals Tactical Operations Center (TOC)"
requires-python = ">=3.11"
dependencies = [
    "toc-shared",
    "pydantic>=2.7.0",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "anthropic>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sigtoc"]
