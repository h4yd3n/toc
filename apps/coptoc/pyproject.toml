[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coptoc"
version = "0.1.0"
description = "Policy-as-Code Compiler & Content Moderation Engine"
requires-python = ">=3.11"
dependencies = [
    "toc-shared",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "anthropic>=0.25.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27.0",
]
